name: Preverjanje

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    # HACS bere repozitorij od zunaj, kar deluje šele, ko je javen
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands license

  tests:
    name: Testi integracije (${{ matrix.ha }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: newest
            python: "3.13"
            packages: pytest-homeassistant-custom-component home-assistant-frontend
          # najstarejši Home Assistant, ki ga dovoli hacs.json: 0.13.190 je testno okolje za 2024.12.0, zraven frontend,
          # ki ga ta različica določa; novejši pycares pusti nit, ki je to okolje še ne pozna
          - ha: "2024.12.0"
            python: "3.12"
            packages: pytest-homeassistant-custom-component==0.13.190 home-assistant-frontend==20241127.4 pycares==4.4.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Integracija je odvisna od frontend, ki v testih potrebuje paket frontend
      - run: pip install ${{ matrix.packages }}
      - run: pytest -q
      - name: Prevedi vse datoteke Python
        run: python -m compileall -q custom_components
