alias: "Daily Energy – fetch from Moj Elektro API"
description: "Every hour runs script.daily_energy_check_updates (the same as the Update button on the dashboard), which fetches daily usage, VT/MT, month totals, tariff blocks and the 15-minute curve straight from the Moj Elektro API and saves only what is new or different. With force = false it does not contact Moj Elektro when nothing is missing."
triggers:
  - trigger: "time_pattern"
    minutes: 5
actions:
  - action: "script.daily_energy_check_updates"
    data:
      force: false
    response_variable: "result"
    continue_on_error: true
  - if:
      - condition: "template"
        value_template: "{{ result is defined and (result.changes | default([]) | count) > 0 }}"
    then:
      - action: "logbook.log"
        data:
          name: "Daily Energy API"
          message: "{{ result.changes | join(', ') }}"
mode: "single"
max_exceeded: "silent"
