alias: "Daily Energy check updates"
description: "Fetches everything the Daily Energy dashboard shows straight from the Moj Elektro API and saves what is new or changed. 1) Daily meter readings (rest_command.mojelektro_readings; total, VT, MT at 00:00): usage, VT, MT and month-to-date totals of the last three days. 2) 15-minute data (rest_command.mojelektro_15min) of the last two days: the 15-minute chart, and the tariff blocks once a day is complete. A day's log item is written at most once per run, merged into what is stored, and only when Moj Elektro's numbers are new or different; 15-minute data is only replaced by data that is at least as complete. Run by the Update button (force) and by the automation 'Daily Energy – fetch from Moj Elektro API' (skips the requests when nothing is missing). Returns changed = true when anything in the log changed."
icon: "mdi:cloud-refresh"
mode: "single"
max_exceeded: "silent"
fields:
  force:
    description: "true = always ask Moj Elektro (Update button); false = only when something is still missing (automation)"
    default: true
    selector:
      boolean: {}
  dry_run:
    description: "true = only report what would change"
    default: false
    selector:
      boolean: {}
sequence:
  - variables:
      meter: "YOUR-METER-ID"
      rt15: "32.0.2.4.1.2.12.0.0.0.0.0.0.0.0.3.72.0"
      rt_et: "32.0.4.1.1.2.12.0.0.0.0.0.0.0.0.3.72.0"
      rt_vt: "32.0.4.1.1.2.12.0.0.0.0.1.0.0.0.3.72.0"
      rt_mt: "32.0.4.1.1.2.12.0.0.0.0.2.0.0.0.3.72.0"
      today: "{{ now().date().isoformat() }}"
      tomorrow: "{{ (now().date() + timedelta(days=1)).isoformat() }}"
      d1: "{{ (now().date() - timedelta(days=1)).isoformat() }}"
      d2: "{{ (now().date() - timedelta(days=2)).isoformat() }}"
      d3: "{{ (now().date() - timedelta(days=3)).isoformat() }}"
      m1: "{{ (now().date() - timedelta(days=3)).replace(day=1).isoformat() }}"
      m1_next: "{{ ((now().date() - timedelta(days=3)).replace(day=1) + timedelta(days=1)).isoformat() }}"
      test: "{{ dry_run | default(false) | bool }}"
      forced: "{{ force | default(true) | bool }}"
  - variables:
      labels: "{{ ['Moj Elektro · ' ~ d3, 'Moj Elektro · ' ~ d2, 'Moj Elektro · ' ~ d1, 'Moj Elektro 15min · ' ~ d2, 'Moj Elektro 15min · ' ~ d1] }}"
  - alias: "Log before"
    action: "todo.get_items"
    target:
      entity_id: "todo.daily_energy_log"
    data:
      status: "needs_action"
    response_variable: "before"
  - variables:
      items: "{{ before['todo.daily_energy_log']['items'] | selectattr('summary', 'in', labels) | list }}"
      snap_before: "{% for it in before['todo.daily_energy_log']['items'] | selectattr('summary', 'in', labels) | sort(attribute='summary') %}{{ it.summary }}={{ it.description }}|{% endfor %}"
  - variables:
      missing: "{% set m = namespace(l=[]) %}{% set q1 = items | selectattr('summary', 'eq', 'Moj Elektro 15min · ' ~ d1) | first | default(none) %}{% set q2 = items | selectattr('summary', 'eq', 'Moj Elektro 15min · ' ~ d2) | first | default(none) %}{% set j1 = (q1.description | from_json) if q1 else {} %}{% set j2 = (q2.description | from_json) if q2 else {} %}{% if (j1.q15 | default([]) | count) < 92 or (j1.miss | default(0) | int(0)) > 0 %}{% set m.l = m.l + ['15-min ' ~ d1] %}{% endif %}{% if (j2.miss | default(0) | int(0)) > 0 %}{% set m.l = m.l + ['15-min ' ~ d2] %}{% endif %}{% for d in [d3, d2] %}{% set it = items | selectattr('summary', 'eq', 'Moj Elektro · ' ~ d) | first | default(none) %}{% if not it or ((it.description | from_json).u is not defined) %}{% set m.l = m.l + ['total ' ~ d] %}{% endif %}{% endfor %}{{ m.l }}"
  - if:
      - condition: "template"
        value_template: "{{ not forced and missing | count == 0 }}"
    then:
      - variables:
          result: "{{ {'changed': false, 'skipped': 'nothing missing'} }}"
      - stop: "nothing missing"
        response_variable: "result"
  - alias: "15-minute data of the last two days"
    action: "rest_command.mojelektro_15min"
    data:
      meter: "{{ meter }}"
      start: "{{ d2 }}"
      end: "{{ today }}"
    response_variable: "r15"
    continue_on_error: true
  - alias: "Meter readings from the 1st of the month (for month totals)"
    action: "rest_command.mojelektro_readings"
    data:
      meter: "{{ meter }}"
      start: "{{ m1 }}"
      end: "{{ m1_next }}"
      rt: "{{ rt_et }}"
    response_variable: "e1"
    continue_on_error: true
  - delay:
      milliseconds: 300
  - action: "rest_command.mojelektro_readings"
    data:
      meter: "{{ meter }}"
      start: "{{ m1 }}"
      end: "{{ m1_next }}"
      rt: "{{ rt_vt }}"
    response_variable: "v1"
    continue_on_error: true
  - action: "rest_command.mojelektro_readings"
    data:
      meter: "{{ meter }}"
      start: "{{ m1 }}"
      end: "{{ m1_next }}"
      rt: "{{ rt_mt }}"
    response_variable: "t1"
    continue_on_error: true
  - delay:
      milliseconds: 1100
    alias: "Moj Elektro allows 5 requests per second"
  - alias: "Meter readings of the last days"
    action: "rest_command.mojelektro_readings"
    data:
      meter: "{{ meter }}"
      start: "{{ d3 }}"
      end: "{{ tomorrow }}"
      rt: "{{ rt_et }}"
    response_variable: "e2"
    continue_on_error: true
  - delay:
      milliseconds: 300
  - action: "rest_command.mojelektro_readings"
    data:
      meter: "{{ meter }}"
      start: "{{ d3 }}"
      end: "{{ tomorrow }}"
      rt: "{{ rt_vt }}"
    response_variable: "v2"
    continue_on_error: true
  - action: "rest_command.mojelektro_readings"
    data:
      meter: "{{ meter }}"
      start: "{{ d3 }}"
      end: "{{ tomorrow }}"
      rt: "{{ rt_mt }}"
    response_variable: "t2"
    continue_on_error: true
  - variables:
      ok15: "{{ r15 is defined and r15.status | default(0) == 200 and r15.content is mapping }}"
      okrd: "{{ e2 is defined and e2.status | default(0) == 200 and e2.content is mapping }}"
  - if:
      - condition: "template"
        value_template: "{{ not ok15 and not okrd }}"
    then:
      - variables:
          result: "{{ {'changed': false, 'error': 'Moj Elektro did not answer'} }}"
      - stop: "Moj Elektro did not answer"
        response_variable: "result"
  - variables:
      rd: "{% set ns = namespace(et={}, vt={}, mt={}) %}{% for pair in [['et', e1 if e1 is defined else {}], ['et', e2 if e2 is defined else {}], ['vt', v1 if v1 is defined else {}], ['vt', v2 if v2 is defined else {}], ['mt', t1 if t1 is defined else {}], ['mt', t2 if t2 is defined else {}]] %}{% set r = pair[1] %}{% if r.status | default(0) == 200 and r.content is mapping %}{% for b in r.content.intervalBlocks | default([]) %}{% for x in b.intervalReadings | default([]) %}{% set ds = as_datetime(x.timestamp).strftime('%Y-%m-%d') %}{% set v = x.value | float(-1) %}{% if v >= 0 %}{% if pair[0] == 'et' %}{% set ns.et = dict(ns.et, **{ds: v}) %}{% elif pair[0] == 'vt' %}{% set ns.vt = dict(ns.vt, **{ds: v}) %}{% else %}{% set ns.mt = dict(ns.mt, **{ds: v}) %}{% endif %}{% endif %}{% endfor %}{% endfor %}{% endif %}{% endfor %}{{ {'et': ns.et, 'vt': ns.vt, 'mt': ns.mt} }}"
      rows: "{% set ns = namespace(l=[]) %}{% if ok15 %}{% set hol = ['01-01','01-02','02-08','04-27','05-01','05-02','06-25','08-15','10-31','11-01','12-25','12-26'] %}{% set easter_mon = ['2025-04-21','2026-04-06','2027-03-29','2028-04-17','2029-04-02','2030-04-22','2031-04-14','2032-03-29','2033-04-18','2034-04-10','2035-03-26'] %}{% for b in r15.content.intervalBlocks | default([]) if b.readingType == rt15 %}{% for r in b.intervalReadings | default([]) %}{% set st = as_datetime(r.timestamp) - timedelta(minutes=15) %}{% set ds = st.strftime('%Y-%m-%d') %}{% if d2 <= ds < today %}{% set h = st.hour %}{% set free = st.weekday() >= 5 or st.strftime('%m-%d') in hol or ds in easter_mon %}{% set tier = 0 if (7 <= h < 14 or 16 <= h < 20) else (1 if (h == 6 or 14 <= h < 16 or 20 <= h < 22) else 2) %}{% set est = (r.readingQualities | default([]) | map(attribute='readingQualityType') | select('match', '^(1\\\\.5\\\\.|3\\\\.)') | list | count) > 0 %}{% set ns.l = ns.l + [{'d': ds, 't': as_timestamp(st), 'v': (r.value | float(0)) | round(4), 'f': est, 'b': (1 if st.month in [11, 12, 1, 2] else 2) + (1 if free else 0) + tier}] %}{% endif %}{% endfor %}{% endfor %}{% endif %}{{ ns.l }}"
  - variables:
      days15: "{% set out = namespace(l=[]) %}{% for d in [d2, d1] %}{% set it = rows | selectattr('d', 'eq', d) | sort(attribute='t') | list %}{% if it | count >= 92 %}{% set bs = namespace(x=[]) %}{% for k in range(1, 6) %}{% set bs.x = bs.x + [(it | selectattr('b', 'eq', k) | map(attribute='v') | sum) | round(3)] %}{% endfor %}{% set out.l = out.l + [{'d': d, 'q15': it | map(attribute='v') | list, 'miss': it | selectattr('f') | list | count, 'b': bs.x}] %}{% endif %}{% endfor %}{{ out.l }}"
      totals: "{% set out = namespace(l=[]) %}{% for d in [d3, d2, d1] %}{% set n = (as_datetime(d) + timedelta(days=1)).strftime('%Y-%m-%d') %}{% set fm = d[:8] ~ '01' %}{% set ok = namespace(v=true) %}{% for k in ['et', 'vt', 'mt'] %}{% for x in [d, n, fm] %}{% if rd[k][x] is not defined %}{% set ok.v = false %}{% endif %}{% endfor %}{% endfor %}{% if ok.v %}{% set u = (rd.et[n] - rd.et[d]) | round(3) %}{% set vt = (rd.vt[n] - rd.vt[d]) | round(3) %}{% set mt = (rd.mt[n] - rd.mt[d]) | round(3) %}{% if u >= 0 and vt >= 0 and mt >= 0 and (u - vt - mt) | abs < 0.02 %}{% set out.l = out.l + [{'d': d, 'u': u, 'vt': vt, 'mt': mt, 'mo': (rd.et[n] - rd.et[fm]) | round(3), 'mvt': (rd.vt[n] - rd.vt[fm]) | round(3), 'mmt': (rd.mt[n] - rd.mt[fm]) | round(3)}] %}{% endif %}{% endif %}{% endfor %}{{ out.l }}"
  - variables:
      writes: "{% set w = namespace(l=[]) %}{% for x in days15 %}{% set o15 = items | selectattr('summary', 'eq', 'Moj Elektro 15min · ' ~ x.d) | first | default(none) %}{% set oj = (o15.description | from_json) if o15 else {} %}{% set desc15 = {'d': x.d, 'q15': x.q15, 'miss': x.miss} | to_json %}{% if not o15 %}{% set w.l = w.l + [{'kind': '15-min data added', 'd': x.d, 'uid': none, 'label': 'Moj Elektro 15min · ' ~ x.d, 'desc': desc15}] %}{% elif x.miss <= (oj.miss | default(0) | int(0)) and (x.q15 != oj.q15 or x.miss != (oj.miss | default(0) | int(0))) %}{% set w.l = w.l + [{'kind': '15-min data updated', 'd': x.d, 'uid': o15.uid, 'label': o15.summary, 'desc': desc15}] %}{% endif %}{% endfor %}{% for d in [d3, d2, d1] %}{% set di = items | selectattr('summary', 'eq', 'Moj Elektro · ' ~ d) | first | default(none) %}{% set dj = (di.description | from_json) if di else {} %}{% set p = namespace(v={}, what=[]) %}{% set t = totals | selectattr('d', 'eq', d) | first | default(none) %}{% if t %}{% set diff = namespace(n=false) %}{% for k in ['u', 'vt', 'mt', 'mo', 'mvt', 'mmt'] %}{% if dj[k] is not defined or ((dj[k] | float(0)) - t[k]) | abs > 0.0015 %}{% set diff.n = true %}{% endif %}{% endfor %}{% if diff.n %}{% set p.v = dict(p.v, u=t.u, vt=t.vt, mt=t.mt, mo=t.mo, mvt=t.mvt, mmt=t.mmt) %}{% set p.what = p.what + ['totals'] %}{% endif %}{% endif %}{% set x = days15 | selectattr('d', 'eq', d) | first | default(none) %}{% if x and x.miss == 0 %}{% set ob = dj.b | default([]) %}{% set diff = namespace(n=(ob | count != 5)) %}{% if not diff.n %}{% for k in range(5) %}{% if ((ob[k] | float(0)) - x.b[k]) | abs > 0.0015 %}{% set diff.n = true %}{% endif %}{% endfor %}{% endif %}{% if diff.n %}{% set p.v = dict(p.v, b=x.b) %}{% set p.what = p.what + ['tariff blocks'] %}{% endif %}{% endif %}{% if p.what | count > 0 %}{% set w.l = w.l + [{'kind': (p.what | join(' + ')) ~ (' updated' if di else ' added'), 'd': d, 'uid': di.uid if di else none, 'label': 'Moj Elektro · ' ~ d, 'desc': dict(dict(dj, d=d, me=true), **p.v) | to_json}] %}{% endif %}{% endfor %}{{ w.l }}"
  - variables:
      changes: "{% set c = namespace(l=[]) %}{% for x in writes %}{% set c.l = c.l + [x.kind ~ ' ' ~ x.d] %}{% endfor %}{{ c.l }}"
  - if:
      - condition: "template"
        value_template: "{{ not test }}"
    then:
      - repeat:
          for_each: "{{ writes }}"
          sequence:
            - if:
                - condition: "template"
                  value_template: "{{ repeat.item.uid is not none }}"
              then:
                - action: "todo.update_item"
                  target:
                    entity_id: "todo.daily_energy_log"
                  data:
                    item: "{{ repeat.item.uid }}"
                    description: "{{ repeat.item.desc }}"
              else:
                - action: "todo.add_item"
                  target:
                    entity_id: "todo.daily_energy_log"
                  data:
                    item: "{{ repeat.item.label }}"
                    description: "{{ repeat.item.desc }}"
  - alias: "Log after"
    action: "todo.get_items"
    target:
      entity_id: "todo.daily_energy_log"
    data:
      status: "needs_action"
    response_variable: "after"
  - variables:
      snap_after: "{% for it in after['todo.daily_energy_log']['items'] | selectattr('summary', 'in', labels) | sort(attribute='summary') %}{{ it.summary }}={{ it.description }}|{% endfor %}"
  - variables:
      result: "{{ {'changed': snap_after != snap_before, 'dry_run': test, 'missing_before': missing, 'meter_totals_for': totals | map(attribute='d') | list, 'quarters_not_published_yet': days15 | map(attribute='miss') | list, 'changes': changes} }}"
  - stop: "done"
    response_variable: "result"
